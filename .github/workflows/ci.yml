name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Parallel vitest workers + undici/msw break on ubuntu (bind in decompress.js).
      - run: npm test -- --run --no-file-parallelism
      - run: npm run build